<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name|default('翻译文集') }}{% endblock %}</title>
  <link rel="stylesheet" href="{% block css_path %}static/css/style.css{% endblock %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1><a href="{% block home_link %}index.html{% endblock %}">{{ site_name|default('翻译文集') }}</a></h1>
      <p class="subtitle">中文翻译版 · 仅供个人学习</p>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>原文来源：<a href="{{ source_url|default('#') }}" target="_blank" rel="noopener">{{ source_label|default('') }}</a></p>
      <p>本站内容由 AI 翻译，仅供个人学习参考</p>
      <p><a href="{% block portal_link %}../index.html{% endblock %}">← 返回站点导航</a></p>
    </footer>
  </div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var KEY = '{{ site_key|default("site") }}_read';
  var read;
  try { read = JSON.parse(localStorage.getItem(KEY) || '{}'); if (typeof read !== 'object' || Array.isArray(read)) read = {}; } catch(e) { read = {}; }

  var slug = location.pathname.match(/articles\/([^\/]+)\.html/);
  if (slug) { read[slug[1]] = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(read)); } catch(e) {} }

  var items = document.querySelectorAll('.article-list a');
  var total = 0, done = 0;
  items.forEach(function(a){
    var href = a.getAttribute('href') || '';
    var m = href.match(/articles\/([^\/]+)\.html/);
    if (!m) return;
    total++;
    if (read[m[1]]) {
      a.style.opacity = '0.5';
      a.insertAdjacentHTML('afterbegin', '<span style="color:#2d5a7b;margin-right:6px">✓</span>');
      done++;
    }
  });
  var h = document.querySelector('.nav-section h2');
  if (total > 0 && h) h.textContent += ' · 已读 ' + done + '/' + total;
});
</script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('.math-inline, .math-display').forEach(function(el){
    try {
      katex.render(el.getAttribute('data-math') || el.textContent, el, {
        displayMode: el.classList.contains('math-display'),
        throwOnError: false
      });
    } catch(e) {}
  });
});
</script>
</body>
</html>
