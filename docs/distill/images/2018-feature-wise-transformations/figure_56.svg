<?xml version="1.0" encoding="UTF-8"?>
<svg viewbox="0 0 704 340" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><path d="M 0 0 C -2.779 1 -5.376 2.445 -7.69 4.28 L -6.14 0 L -7.69 -4.28 C -5.376 -2.445 -2.779 -1 0 0 Z" id="arrow-right"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-down" transform="rotate(180, 0, 0)"></path><path d="M 0 6 a 6 6 0 0 1 6 -6 l 8 0 a 6 6 0 0 1 6 6 l 0 14 l -20 0 Z" id="column-top"></path><path d="M 0 0 l 20 0 l 0 20 l -20 0 Z" id="column-middle"></path><path d="M 0 0 l 20 0 l 0 14 a 6 6 0 0 1 -6 6 l -8 0 a 6 6 0 0 1 -6 -6 Z" id="column-bottom"></path></defs><text class="figure-text" dy="1em" x="10" y="10"><tspan> The <tspan style="font-style: italic;">squeeze-and-excitation</tspan> block </tspan><tspan dy="1.5em" x="10"> uses <tspan style="font-weight: bold;">sigmoidal gating</tspan>. First, the </tspan><tspan dy="1.5em" x="10"> network maps input feature maps </tspan><tspan dy="1.5em" x="10"> to a gating vector. </tspan></text><text class="figure-text" dy="1em" x="260" y="220"><tspan> The gating vector is then multiplied </tspan><tspan dy="1.5em" x="260"> with the input feature maps. </tspan></text><g transform="translate(-190, 10)"><g transform="translate(284, 200)"><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="0" y="0"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="10" y="10"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="20" y="20"></rect><text class="figure-text" dy="0.4em" x="30" y="30">input</text></g><path class="figure-line" d="M 404 260 L 660 260"></path><use class="figure-path" transform="translate(660, 260)" xlink:href="#arrow-right"></use><g transform="translate(675, 260)"><circle class="figure-element" r="10"></circle><ellipse class="figure-path" rx="2" ry="2"></ellipse></g><path class="figure-line" d="M 685 260 L 765 260"></path><use class="figure-path" transform="translate(765, 260)" xlink:href="#arrow-right"></use><g transform="translate(770, 200)"><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="0" y="0"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="10" y="10"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="20" y="20"></rect><text class="figure-text" dy="0.4em" x="30" y="30">output</text></g><path class="figure-line" d="M 404 260 L 428 260 a 6 6 0 0 0 6 -6 L 434 66 a 6 6 0 0 1 6 -6 L 450 60"></path><use class="figure-path" transform="translate(450, 60)" xlink:href="#arrow-right"></use><g transform="translate(455, 0)"><rect class="figure-film-generator figure-element figure-box" height="120" width="40"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 20, 60)" x="20" y="60">global pooling</text></g><path class="figure-line" d="M 495 60 L 520 60"></path><use class="figure-path" transform="translate(520, 60)" xlink:href="#arrow-right"></use><g transform="translate(525, 0)"><rect class="figure-film-generator figure-element figure-box" height="120" width="40"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 20, 60)" x="20" y="60">ReLU layer</text></g><path class="figure-line" d="M 565 60 L 590 60"></path><use class="figure-path" transform="translate(590, 60)" xlink:href="#arrow-right"></use><g transform="translate(595, 0)"><rect class="figure-film-generator figure-element figure-box" height="120" width="40"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 20, 60)" x="20" y="60">sigmoidal layer</text></g><path class="figure-line" d="M 635 60 L 660 60"></path><use class="figure-path" transform="translate(660, 60)" xlink:href="#arrow-right"></use><g transform="translate(665, 30)"><use class="figure-film-generator figure-element" transform="translate(0, 0)" xlink:href="#column-top"></use><use class="figure-film-generator figure-element" transform="translate(0, 20)" xlink:href="#column-middle"></use><use class="figure-film-generator figure-element" transform="translate(0, 40)" xlink:href="#column-bottom"></use></g><path class="figure-line" d="M 675 90 L 675 245"></path><use class="figure-path" transform="translate(675, 245)" xlink:href="#arrow-down"></use></g></svg>