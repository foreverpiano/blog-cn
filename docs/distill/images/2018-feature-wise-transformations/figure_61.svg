<?xml version="1.0" encoding="UTF-8"?>
<svg viewbox="0 0 704 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><path d="M 0 0 C -2.779 1 -5.376 2.445 -7.69 4.28 L -6.14 0 L -7.69 -4.28 C -5.376 -2.445 -2.779 -1 0 0 Z" id="arrow-right"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-up"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-down" transform="rotate(180, 0, 0)"></path><path d="M 0 6 a 6 6 0 0 1 6 -6 l 8 0 a 6 6 0 0 1 6 6 l 0 14 l -20 0 Z" id="column-top"></path><path d="M 0 0 l 20 0 l 0 20 l -20 0 Z" id="column-middle"></path><path d="M 0 0 l 20 0 l 0 14 a 6 6 0 0 1 -6 6 l -8 0 a 6 6 0 0 1 -6 -6 Z" id="column-bottom"></path></defs><text class="figure-text" dy="1em" x="380" y="10"><tspan> The <tspan style="font-style: italic;">gated linear unit</tspan> activation function </tspan><tspan dy="1.5em" x="380"> uses <tspan style="font-weight: bold;">sigmoidal gating</tspan>. Half of the input </tspan><tspan dy="1.5em" x="380"> features go through a sigmoid function </tspan><tspan dy="1.5em" x="380"> to produce a gating vector. </tspan></text><text class="figure-text" dy="1em" x="380" y="170"><tspan> The gating vector is then multiplied </tspan><tspan dy="1.5em" x="380"> with the second half of the features. </tspan></text><g transform="translate(10, 10)"><text class="figure-text" dy="0.4em" style="text-anchor: begin;" x="0" y="177.5">input</text><g transform="translate(40, 120)"><use class="figure-film-generator figure-element" transform="translate(0, 0)" xlink:href="#column-top"></use><use class="figure-film-generator figure-element" transform="translate(0, 20)" xlink:href="#row-middle"></use><use class="figure-film-generator figure-element" transform="translate(0, 40)" xlink:href="#row-middle"></use><use class="figure-filmed-network figure-element" transform="translate(0, 60)" xlink:href="#row-middle"></use><use class="figure-filmed-network figure-element" transform="translate(0, 80)" xlink:href="#row-middle"></use><use class="figure-filmed-network figure-element" transform="translate(0, 100)" xlink:href="#column-bottom"></use></g><path class="figure-line" d="M 60 210 L 319 210"></path><use class="figure-path" transform="translate(319, 210)" xlink:href="#arrow-right"></use><g transform="translate(334, 210)"><circle class="figure-element" r="10"></circle><ellipse class="figure-path" rx="2" ry="2"></ellipse></g><path class="figure-line" d="M 345 210 L 600 210"></path><use class="figure-path" transform="translate(600, 210)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 60 150 L 130 150 a 6 6 0 0 0 6 -6 L 136 66 a 6 6 0 0 1 6 -6 L 200 60"></path><use class="figure-path" transform="translate(200, 60)" xlink:href="#arrow-right"></use><g transform="translate(205, 0)"><rect class="figure-film-generator figure-element figure-box" height="120" width="40"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 20, 60)" x="20" y="60">sigmoid</text></g><path class="figure-line" d="M 245 60 L 319 60"></path><use class="figure-path" transform="translate(319, 60)" xlink:href="#arrow-right"></use><g transform="translate(324, 30)"><use class="figure-film-generator figure-element" transform="translate(0, 0)" xlink:href="#column-top"></use><use class="figure-film-generator figure-element" transform="translate(0, 20)" xlink:href="#row-middle"></use><use class="figure-film-generator figure-element" transform="translate(0, 40)" xlink:href="#column-bottom"></use></g><path class="figure-line" d="M 334 90 L 334 195"></path><use class="figure-path" transform="translate(334, 195)" xlink:href="#arrow-down"></use><g transform="translate(605, 180)"><use class="figure-filmed-network figure-element" transform="translate(0, 0)" xlink:href="#column-top"></use><use class="figure-filmed-network figure-element" transform="translate(0, 20)" xlink:href="#row-middle"></use><use class="figure-filmed-network figure-element" transform="translate(0, 40)" xlink:href="#column-bottom"></use></g><text class="figure-text" dy="0.4em" style="text-anchor: begin;" x="630" y="210">output</text></g></svg>