<svg viewbox="0 0 704 430" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><path d="M10,185l684,0" style="stroke-width: 1px; stroke: #666; opacity: 0.15;"></path><defs><path d="M 0 0 C -2.779 1 -5.376 2.445 -7.69 4.28 L -6.14 0 L -7.69 -4.28 C -5.376 -2.445 -2.779 -1 0 0 Z" id="arrow-right"></path></defs><text class="figure-text" dy="1em" x="10" y="0"><tspan> The model incorrectly answers a question </tspan><tspan dy="1.5em" x="10"> which involves an unseen combination </tspan><tspan dy="1.5em" x="10"> of concepts (in <tspan style="font-weight: bold">bold</tspan>). </tspan></text><text class="figure-text" dy="1em" x="10" y="220"><tspan> Rather than using the FiLM parameters </tspan><tspan dy="1.5em" x="10"> of the FiLM generator, we can use those </tspan><tspan dy="1.5em" x="10"> produced by combining questions with </tspan><tspan dy="1.5em" x="10"> familiar combinations of concepts (in </tspan><tspan dy="1.5em" x="10"><tspan style="font-weight: bold">bold</tspan>). This corrects the model’s answer. </tspan></text><g transform="translate(90, 0)"><image height="127.67" style="clip-path: inset(0 0 0 0 round 6px);" width="192" x="260" xlink:href="images/analogy_image.jpg" y="0"/><text class="figure-text" style="font-style: italic;" x="260" y="150"> Q: What is the <tspan style="font-weight: bold">blue</tspan> big <tspan style="font-weight: bold">cylinder</tspan> made of? </text><text class="figure-text" dy="-1em" style="font-style: italic;" x="490" y="70"> Q ? </text><path class="figure-path" d="M 457 70 L 535 70"></path><use class="figure-path" x="535" xlink:href="#arrow-right" y="70"></use><text class="figure-text" dy="0.4em" style="fill: red" x="545" y="70">Rubber ✘</text><image height="127.67" style="clip-path: inset(0 0 0 0 round 6px);" width="192" x="260" xlink:href="images/analogy_image.jpg" y="220"/><text class="figure-text" style="font-style: italic;" x="260" y="370"><tspan> Q<tspan class="subscript" dy="4px">A</tspan></tspan><tspan dy="-4px"> : What is the <tspan style="font-weight: bold">blue</tspan> big <tspan style="font-weight: bold">sphere</tspan> made of? </tspan><tspan dy="2em" x="260"> Q<tspan class="subscript" dy="4px">B</tspan></tspan><tspan dy="-4px"> : What is the <tspan style="font-weight: bold">green</tspan> big <tspan style="font-weight: bold">cylinder</tspan> made of? </tspan><tspan dy="2em" x="260"> Q<tspan class="subscript" dy="4px">C</tspan></tspan><tspan dy="-4px"> : What is the <tspan style="font-weight: bold">green</tspan> big <tspan style="font-weight: bold">sphere</tspan> made of? </tspan></text><text class="figure-text" dy="-1em" style="font-style: italic;" x="460" y="290"><tspan>Q</tspan><tspan class="subscript" dy="4px">A</tspan><tspan dy="-4px">+ Q</tspan><tspan class="subscript" dy="4px">B</tspan><tspan dy="-4px">- Q</tspan><tspan class="subscript" dy="4px">C</tspan><tspan dy="-4px"> ?</tspan></text><path class="figure-path" d="M 457 290 L 535 290"></path><use class="figure-path" x="535" xlink:href="#arrow-right" y="290"></use><text class="figure-text" dy="0.4em" style="fill: green" x="545" y="290">Metal ✔</text></g></svg>