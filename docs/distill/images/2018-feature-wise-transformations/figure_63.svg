<svg viewbox="0 0 704 340" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><path d="M 0 0 C -2.779 1 -5.376 2.445 -7.69 4.28 L -6.14 0 L -7.69 -4.28 C -5.376 -2.445 -2.779 -1 0 0 Z" id="arrow-right"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-up"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-down" transform="rotate(180, 0, 0)"></path><path d="M 0 6 a 6 6 0 0 1 6 -6 l 8 0 a 6 6 0 0 1 6 6 l 0 14 l -20 0 Z" id="column-top"></path><path d="M 0 0 l 20 0 l 0 20 l -20 0 Z" id="column-middle"></path><path d="M 0 0 l 20 0 l 0 14 a 6 6 0 0 1 -6 6 l -8 0 a 6 6 0 0 1 -6 -6 Z" id="column-bottom"></path></defs><text class="figure-text" dy="1em" x="10" y="10"><tspan> Dhingra et al. use <tspan style="font-weight: bold;">conditional scaling</tspan> to </tspan><tspan dy="1.5em" x="10"> integrate query information into a document </tspan><tspan dy="1.5em" x="10"> processing network. Applying soft attention </tspan><tspan dy="1.5em" x="10"> to the <tspan style="font-weight: bold;">query representation tokens</tspan></tspan><tspan dy="1.5em" x="10"></tspan><tspan dy="1.5em" x="10"> produces the scaling vector. </tspan></text><text class="figure-text" dy="1em" x="10" y="210"><tspan> The scaling vector is then multiplied with </tspan><tspan dy="1.5em" x="10"> the input <tspan style="font-weight: bold;">document representation token</tspan></tspan></text><g transform="translate(0, 10)"><text class="figure-text" dy="-1.5em" style="font-weight: bold;" x="284" y="200"><tspan>document</tspan><tspan dy="1.5em" x="284">representation</tspan><tspan dy="1.5em" x="284">token</tspan></text><g transform="translate(284, 230)"><use class="figure-filmed-network figure-element" transform="translate(0, 0)" xlink:href="#column-top"></use><use class="figure-filmed-network figure-element" transform="translate(0, 20)" xlink:href="#column-middle"></use><use class="figure-filmed-network figure-element" transform="translate(0, 40)" xlink:href="#column-bottom"></use></g><path class="figure-line" d="M 304 260 L 488 260"></path><use class="figure-path" transform="translate(488, 260)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 304 260 L 428 260 A 6 6 0 0 0 434 254 L 434 125"></path><use class="figure-path" transform="translate(434, 125)" xlink:href="#arrow-up"></use><g transform="translate(504, 260)"><circle class="figure-element" r="10"></circle><ellipse class="figure-path" rx="2" ry="2"></ellipse></g><path class="figure-line" d="M 514 260 L 599 260"></path><use class="figure-path" transform="translate(599, 260)" xlink:href="#arrow-right"></use><text class="figure-text" style="font-weight: bold;" x="604" y="200"><tspan>output</tspan><tspan dy="1.5em" x="604">token</tspan></text><g transform="translate(604, 230)"><use class="figure-filmed-network figure-element" transform="translate(0, 0)" xlink:href="#column-top"></use><use class="figure-filmed-network figure-element" transform="translate(0, 20)" xlink:href="#column-middle"></use><use class="figure-filmed-network figure-element" transform="translate(0, 40)" xlink:href="#column-bottom"></use></g><text class="figure-text" dy="-1.5em" style="font-weight: bold;" x="284" y="60"><tspan>query</tspan><tspan dy="1.5em" x="284">representation</tspan><tspan dy="1.5em" x="284">tokens</tspan></text><g transform="translate(414, 0)"><rect class="figure-film-generator figure-element figure-box" height="120" width="40"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 20, 60)" x="20" y="60">soft attention</text></g><g transform="translate(494, 30)"><use class="figure-film-generator figure-element" transform="translate(0, 0)" xlink:href="#column-top"></use><use class="figure-film-generator figure-element" transform="translate(0, 20)" xlink:href="#column-middle"></use><use class="figure-film-generator figure-element" transform="translate(0, 40)" xlink:href="#column-bottom"></use></g><path class="figure-line" d="M 380 60 L 409 60"></path><use class="figure-path" transform="translate(409, 60)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 455 60 L 489 60"></path><use class="figure-path" transform="translate(489, 60)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 504 90 L 504 245"></path><use class="figure-path" transform="translate(504, 245)" xlink:href="#arrow-down"></use></g></svg>