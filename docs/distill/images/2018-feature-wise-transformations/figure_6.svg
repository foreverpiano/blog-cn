<svg viewbox="0 0 704 170" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><path d="M 0 0 C -2.779 1 -5.376 2.445 -7.69 4.28 L -6.14 0 L -7.69 -4.28 C -5.376 -2.445 -2.779 -1 0 0 Z" id="arrow-right"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-down" transform="rotate(180, 0, 0)"></path></defs><g transform="translate(520, 0)"><text class="figure-text" dy="1em" x="0" y="10"><tspan> A <tspan style="font-weight: bold;">decoder-based</tspan></tspan><tspan dy="1.5em" x="0"><tspan style="font-weight: bold;">generative model</tspan></tspan><tspan dy="1.5em" x="0"> maps a source of </tspan><tspan dy="1.5em" x="0"> noise to a sample <tspan dy="1.5em" x="0"> in the context of the </tspan><tspan dy="1.5em" x="0"> “puppy” class. </tspan></tspan></text></g><g transform="translate(30, 0)"><text class="figure-text" dy="0.4em" x="0" y="85">noise</text><path class="figure-line" d="M 40 85 L 75 85"></path><use class="figure-path" transform="translate(75, 85)" xlink:href="#arrow-right"></use><text class="figure-text" style="text-anchor: middle;" x="155" y="10">“puppy”</text><path class="figure-line" d="M 155 20 L 155 40"></path><use class="figure-path" transform="translate(155, 40)" xlink:href="#arrow-down"></use><g transform="translate(80, 45)"><rect class="figure-group figure-box" height="80" width="150"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" x="75" y="40">decoder</text></g><path class="figure-line" d="M 230 85 L 300 85"></path><use class="figure-path" transform="translate(300, 85)" xlink:href="#arrow-right"></use><image height="150" style="clip-path: inset(0 0 0 0 round 6px);" width="150" x="305" xlink:href="images/puppy.jpg" y="10"/></g></svg>