<svg viewbox="0 0 704 510" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><path d="M 0 0 C -2.779 1 -5.376 2.445 -7.69 4.28 L -6.14 0 L -7.69 -4.28 C -5.376 -2.445 -2.779 -1 0 0 Z" id="arrow-right"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-down" transform="rotate(180, 0, 0)"></path></defs><text class="figure-text" x="0" y="20"><tspan> The <tspan style="font-weight: bold;">FiLM generator</tspan> processes the conditioning information </tspan><tspan dy="1.5em" x="0"> and produces parameters that describe how the target network </tspan><tspan dy="1.5em" x="0"> should alter its computation. </tspan></text><path d="M420,10l0,510" style="stroke-width: 1px; stroke: #666; opacity: 0.15;"></path><text class="figure-text" x="460" y="20"><tspan> Here, the <tspan style="font-weight: bold;">FiLM-ed network</tspan>’s computation </tspan><tspan dy="1.5em" x="460"> is conditioned by two FiLM layers. </tspan></text><g transform="translate(0, 40)"><g transform="translate(460, 40)"><text class="figure-text" x="150" y="425">output</text><path class="figure-line" d="M130,399L130,430"></path><use class="figure-path" x="130" xlink:href="#arrow-down" y="430"></use><g class="figure-faded" transform="translate(20, 337)"><rect class="figure-filmed-network figure-group figure-box" height="62" width="222"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" x="111" y="31">sub-network</text></g><path class="figure-line" d="M130,305.5L130,332"></path><use class="figure-path" x="130" xlink:href="#arrow-down" y="332"></use><g class="film-layer" transform="translate(20, 275.5)"><rect class="figure-filmed-network figure-group figure-box" height="30" width="222"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle; font-weight: bold;" x="111" y="15">FiLM</text></g><path class="figure-line" d="M130,244L130,270.5"></path><use class="figure-path" x="130" xl