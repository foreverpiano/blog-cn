<?xml version="1.0" encoding="UTF-8"?>
<svg viewbox="0 0 704 340" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><path d="M 0 0 C -2.779 1 -5.376 2.445 -7.69 4.28 L -6.14 0 L -7.69 -4.28 C -5.376 -2.445 -2.779 -1 0 0 Z" id="arrow-right"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-down" transform="rotate(180, 0, 0)"></path><path d="M 0 6 a 6 6 0 0 1 6 -6 l 8 0 a 6 6 0 0 1 6 6 l 0 14 l -20 0 Z" id="column-top"></path><path d="M 0 0 l 20 0 l 0 20 l -20 0 Z" id="column-middle"></path><path d="M 0 0 l 20 0 l 0 14 a 6 6 0 0 1 -6 6 l -8 0 a 6 6 0 0 1 -6 -6 Z" id="column-bottom"></path></defs><text class="figure-text" dy="1em" x="10" y="10"><tspan> Chaplot et al. use <tspan style="font-weight: bold;">sigmoidal gating</tspan></tspan><tspan dy="1.5em" x="10"> as a multimodal fusion mechanism. </tspan><tspan dy="1.5em" x="10"> An instruction representation is mapped </tspan><tspan dy="1.5em" x="10"> to a scaling vector via a sigmoid layer. </tspan></text><text class="figure-text" dy="1em" x="10" y="210"><tspan> The scaling vector is then multiplied with </tspan><tspan dy="1.5em" x="10"> the input feature maps. A policy network </tspan><tspan dy="1.5em" x="10"> uses the result to decide the next action. </tspan></text><g transform="translate(-30, 10)"><g transform="translate(284, 200)"><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="0" y="0"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="10" y="10"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="20" y="20"></rect><text class="figure-text" dy="0.4em" x="30" y="30">input</text></g><path class="figure-line" d="M 404 260 L 488 260"></path><use class="figure-path" transform="translate(488, 260)" xlink:href="#arrow-right"></use><g transform="translate(504, 260)"><circle class="figure-element" r="10"></circle><ellipse class="figure-path" rx="2" ry="2"></ellipse></g><path class="figure-line" d="M 514 260 L 599 260"></path><use class="figure-path" transform="translate(599, 260)" xlink:href="#arrow-right"></use><g transform="translate(604, 200)"><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="0" y="0"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="10" y="10"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="20" y="20"></rect><text class="figure-text" dy="0.4em" x="30" y="30">output</text></g><text class="figure-text" dy="-0.5em" style="font-weight: bold;" x="284" y="60"><tspan>instruction</tspan><tspan dy="1.5em" x="284">representation</tspan></text><g transform="translate(414, 0)"><rect class="figure-film-generator figure-element figure-box" height="120" width="40"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 20, 60)" x="20" y="60">sigmoid</text></g><g transform="translate(494, 30)"><use class="figure-film-generator figure-element" transform="translate(0, 0)" xlink:href="#column-top"></use><use class="figure-film-generator figure-element" transform="translate(0, 20)" xlink:href="#column-middle"></use><use class="figure-film-generator figure-element" transform="translate(0, 40)" xlink:href="#column-bottom"></use></g><path class="figure-line" d="M 380 60 L 409 60"></path><use class="figure-path" transform="translate(409, 60)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 455 60 L 489 60"></path><use class="figure-path" transform="translate(489, 60)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 504 90 L 504 245"></path><use class="figure-path" transform="translate(504, 245)" xlink:href="#arrow-down"></use></g></svg>