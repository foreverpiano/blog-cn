<?xml version="1.0" encoding="UTF-8"?>
<svg viewbox="0 0 888 570" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><path d="M 0 0 C -2.779 1 -5.376 2.445 -7.69 4.28 L -6.14 0 L -7.69 -4.28 C -5.376 -2.445 -2.779 -1 0 0 Z" id="arrow-right"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-down" transform="rotate(180, 0, 0)"></path></defs><g transform="translate(60, 160)"><text class="figure-text" dy="1em" x="200" y="-150"><tspan> The model processes </tspan><tspan dy="1.5em" x="200"> content and style images </tspan><tspan dy="1.5em" x="200"> up to the adaptive instance </tspan><tspan dy="1.5em" x="200"> normalization layer. </tspan></text><text class="figure-text" dy="1em" x="380" y="-150"><tspan> FiLM parameters are </tspan><tspan dy="1.5em" x="380"> computed as the spatial </tspan><tspan dy="1.5em" x="380"> mean and standard </tspan><tspan dy="1.5em" x="380"> deviation statistics of the </tspan><tspan dy="1.5em" x="380"> style feature maps. </tspan></text><text class="figure-text" dy="1em" x="550" y="-150"><tspan> The FiLM-ed feature maps </tspan><tspan dy="1.5em" x="550"> are fed to the remainder </tspan><tspan dy="1.5em" x="550"> of the network to produce </tspan><tspan dy="1.5em" x="550"> the stylized image. </tspan></text><image height="96" style="clip-path: inset(0 0 0 0 round 6px);" width="96" x="0" xlink:href="images/cassis_cap_lombard_opus_196.jpg" y="0"/><image height="96" style="clip-path: inset(0 0 0 0 round 6px);" width="96" x="0" xlink:href="images/tuebingen_neckarfront.jpg" y="250"/><g class="figure-faded"><path class="figure-line" d="M 96 298 L 195 298"></path><use class="figure-path" transform="translate(195, 298)" xlink:href="#arrow-right"></use></g><g transform="translate(200, -50)"><g class="figure-faded"><path class="figure-line" d="M -104 98 L -5 98"></path><use class="figure-path" transform="translate(-5, 98)" xlink:href="#arrow-right"></use></g><g transform="translate(0, 38)"><rect class="figure-film-generator figure-element figure-box figure-faded" height="120" width="90"></rect><text class="figure-text figure-text-faded" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 45, 60)" x="45" y="60">sub-network</text></g><line class="figure-line" stroke-dasharray="5,5" x1="45" x2="45" y1="160" y2="288"></line><g transform="translate(0, 288)"><rect class="figure-filmed-network figure-element figure-box figure-faded" height="120" width="90"></rect><text class="figure-text figure-text-faded" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 45, 60)" x="45" y="60">sub-network</text></g><g class="figure-faded"><path class="figure-line" d="M 90 98 L 175 98"></path><use class="figure-path" transform="translate(175, 98)" xlink:href="#arrow-right"></use></g><g transform="translate(180, 38)"><rect class="figure-film-generator figure-element figure-box" height="120" width="90"></rect><text class="figure-text" dy="-0.5em" style="text-anchor: middle;" transform="rotate(-90, 45, 60)" x="45" y="60"><tspan style="font-family: serif;">γ, β</tspan><tspan> across</tspan><tspan dy="1.5em" x="45">spatial axes</tspan></text></g><path class="figure-line" d="M 255 158 L 255 283"></path><use class="figure-path" transform="translate(255, 283)" xlink:href="#arrow-down"></use><text class="figure-text" dy="1.5em" style="text-anchor: end;" x="250" y="200">FiLM</text><text class="figure-text" dy="1.5em" style="text-anchor: end;" x="250" y="215">parameters</text><g class="figure-faded"><path class="figure-line" d="M 90 348 L 175 348"></path><use class="figure-path" transform="translate(175, 348)" xlink:href="#arrow-right"></use></g><g transform="translate(180, 288)"><rect class="figure-filmed-network figure-element figure-box figure-faded" height="120" width="35"></rect><text class="figure-text figure-text-faded" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 17.5, 60)" x="17.5" y="60">normalization</text></g><g class="figure-faded"><path class="figure-line" d="M 215 348 L 230 348"></path><use class="figure-path" transform="translate(230, 348)" xlink:href="#arrow-right"></use></g><g transform="translate(235, 288)"><rect class="figure-filmed-network figure-element figure-box" height="120" width="35"></rect><text class="figure-text" dy="0.4em" style="font-weight: bold; text-anchor: middle;" transform="rotate(-90, 17.5, 60)" x="17.5" y="60">FiLM layer</text></g><g class="figure-faded"><path class="figure-line" d="M 270 348 L 345 348"></path><use class="figure-path" transform="translate(345, 348)" xlink:href="#arrow-right"></use></g><path class="figure-line" d="M 175 410 L 175 420 L 275 420 L 275 410" style="stroke-width: 1px;"></path><text class="figure-text" dy="1.5em" x="175" y="420"><tspan> adaptive instance </tspan><tspan dy="1.5em" x="175"> normalization </tspan></text><g transform="translate(350, 288)"><rect class="figure-filmed-network figure-element figure-box figure-faded" height="120" width="90"></rect><text class="figure-text figure-text-faded" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 45, 60)" x="45" y="60">sub-network</text></g><g class="figure-faded"><path class="figure-line" d="M 440 348 L 525 348"></path><use class="figure-path" transform="translate(525, 348)" xlink:href="#arrow-right"></use></g><image height="96" style="clip-path: inset(0 0 0 0 round 6px);" width="96" x="530" xlink:href="images/tuebingen_neckarfront_cassis_cap_lombard_opus_196.jpg" y="300"/></g></g></svg>