<?xml version="1.0" encoding="UTF-8"?>
<svg viewbox="0 0 888 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><filter height="1" id="zoolander-text-background" width="1" x="0" y="0"><feflood flood-color="#fdf6f2"></feflood><fecomposite in="SourceGraphic"></fecomposite></filter></defs><g transform="translate(70, 0)"><text class="figure-text" x="0" y="210"><tspan> Video and audio must be understood in the context of each </tspan><tspan dy="1.5em" x="0"> other to understand the scene. </tspan><tspan dy="2em" style="font-style: italic;" x="0"> Credit: still frame from the movie Charade. </tspan></text><image height="182" style="clip-path: inset(0 0 0 0 round 6px);" width="364" x="0" xlink:href="images/charade.png" y="0"/><path d="M 0 0 C 15 -50 27.5 -50 42.5 0 S 70 50 85 0 S 110.5 -50 127.5 0 S 155 50 170 0 S 197.5 -50 212.5 0 S 240 50 255 0 S 282.5 -50 297.5 0 S 325 50 340 0 S 367.5 -50 382.5 0 S 410 50 425 0" style="fill: none; stroke: #fdf6f2; stroke-width: 3px;" transform="scale(0.50) translate(10, 53)"></path><text class="figure-text" dy="0.4em" filter="url(#zoolander-text-background)" style="opacity: 1; text-anchor: middle;" x="110" y="25">“Are you sure there’s no mistake?”</text></g><g transform="translate(530, 0)"><text class="figure-text" x="0" y="210"><tspan> An image needs to be processed in the context of </tspan><tspan dy="1.5em" x="0"> a question being asked. </tspan><tspan dy="2em" style="font-style: italic;" x="0"> Credit: image-question pair from the CLEVR dataset. </tspan></text><image height="182" style="clip-path: inset(0 0 0 0 round 6px);" width="297.18" x="0" xlink:href="images/clevr_image.jpg" y="0"/><text class="figure-text" dy="0.4em" style="fill: white; opacity: 0.8; font-size: 10px;" x="10" y="120"><tspan>Are there an equal</tspan><tspan dy="1.5em" x="10">number of large</tspan><tspan dy="1.5em" x="10">things and metal</tspan><tspan dy="1.5em" x="10">spheres?</tspan></text></g></svg>