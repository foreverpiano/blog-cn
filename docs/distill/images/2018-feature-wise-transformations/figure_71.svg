<?xml version="1.0" encoding="UTF-8"?>
<svg viewbox="0 0 704 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><path d="M 0 0 C -2.779 1 -5.376 2.445 -7.69 4.28 L -6.14 0 L -7.69 -4.28 C -5.376 -2.445 -2.779 -1 0 0 Z" id="arrow-right"></path><path d="M 0 0 C 1 2.779 2.445 5.376 4.28 7.69 L 0 6.14 L -4.28 7.69 C -2.444 5.376 -1 2.770 0 0 Z" id="arrow-down" transform="rotate(180, 0, 0)"></path></defs><path d="M475,10l0,360" style="stroke-width: 1px; stroke: #666; opacity: 0.5"></path><text class="figure-text" x="10" y="10"><tspan><tspan style="font-weight: bold;">Concatenation-based conditioning</tspan> is used in the class-conditional </tspan><tspan dy="1.5em" x="10"> DCGAN model. Each convolutional layer is concatenated with the </tspan><tspan dy="1.5em" x="10"> broadcased label along the channel axis. </tspan></text><text class="figure-text" x="495" y="10"><tspan> The resulting stack of feature maps </tspan><tspan dy="1.5em" x="495"> is then <tspan style="font-weight: bold;">convolved</tspan> to produce the </tspan><tspan dy="1.5em" x="495"> conditioned output. </tspan></text><g transform="translate(10, 180)"><g transform="translate(0, 30)"><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="0" y="0"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="10" y="10"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="20" y="20"></rect><text class="figure-text" dy="0.4em" x="30" y="30">input</text></g><g transform="translate(191, 30)"><rect class="figure-element figure-box" height="120" width="40"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 20, 60)" x="20" y="60">concatenate</text></g><g transform="translate(302, 30)"><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="0" y="0"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="10" y="10"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="20" y="20"></rect><text class="figure-text" dy="0.4em" x="30" y="30">input</text><rect class="figure-film-generator figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="40" y="40"></rect><text class="figure-text" dy="0.4em" x="50" y="50">class label</text></g><g transform="translate(493, 30)"><rect class="figure-element figure-box" height="120" width="40"></rect><text class="figure-text" dy="0.4em" style="text-anchor: middle;" transform="rotate(-90, 20, 60)" x="20" y="60">convolution</text></g><g transform="translate(564, 30)"><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="0" y="0"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="10" y="10"></rect><rect class="figure-filmed-network figure-element figure-box" height="100" style="fill-opacity: 1;" width="100" x="20" y="20"></rect><text class="figure-text" dy="0.4em" x="30" y="30">output</text></g><path class="figure-line" d="M 120 90 L 186 90"></path><use class="figure-path" transform="translate(186, 90)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 231 90 L 297 90"></path><use class="figure-path" transform="translate(297, 90)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 442 90 L 488 90"></path><use class="figure-path" transform="translate(488, 90)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 533 90 L 559 90"></path><use class="figure-path" transform="translate(559, 90)" xlink:href="#arrow-right"></use><path class="figure-line" d="M 211 -50 L 211 25"></path><use class="figure-path" transform="translate(211, 25)" xlink:href="#arrow-down"></use><text class="figure-text" dy="-0.4em" transform="rotate(-90, 211, 10)" x="211" y="10">broadcast</text><text class="figure-text" dy="-0.4em" style="text-anchor: middle; font-weight: bold;" x="211" y="-60">class label</text></g></svg>