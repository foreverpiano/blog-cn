<g id="High-low frequency detectors respond to a high-frequency neuron factor on one side and low frequency on the other. Notice how the weights rotate:">
<text fill="#666666" font-family="Roboto" font-size="27.5" letter-spacing="0em" style="white-space: pre" xml:space="preserve"><tspan x="1216.68" y="25.3994"> respond to a </tspan><tspan x="850" y="57.3994">high-frequency neuron factor on one side and </tspan><tspan x="850" y="89.3994">low frequency on the other. Notice how the </tspan><tspan x="850" y="121.399">weights rotate:</tspan></text>
<text fill="#666666" font-family="Roboto" font-size="27.5" font-weight="bold" letter-spacing="0em" style="white-space: pre" xml:space="preserve"><tspan x="850" y="25.3994">High-low frequency detectors</tspan></text>
</g>
<text fill="#666666" font-family="Roboto" font-size="27.5" id="This makes them rotationally equivariant." letter-spacing="0em" style="white-space: pre" xml:space="preserve"><tspan x="850" y="259.399">This makes them rotationally equivariant.</tspan></text>
